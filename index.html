<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              value: originalFetch.bind(window),
              writable: true,
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_e) {}
        window.addEventListener(
          'error',
          function (event) {
            if (
              (event && event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Alfa Link — Pós-Venda & Migração de Marketplaces</title>
    <meta name="description" content="Plataforma SaaS multi-tenant de pós-venda, fidelização, gamificação por roleta e migração de clientes de marketplaces para o canal próprio." />

  </head>
